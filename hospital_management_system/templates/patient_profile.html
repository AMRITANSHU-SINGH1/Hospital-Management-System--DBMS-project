<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <title>My Profile</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
          body {
               font-family: Arial, sans-serif;
               background-color: #f5f5f5;
               margin: 0;
               padding: 0;
          }

          .container {
               max-width: 520px;
               margin: 54px auto;
               background: #fff;
               padding: 32px 30px 28px 30px;
               border-radius: 10px;
               box-shadow: 0 4px 16px rgba(0, 0, 0, 0.09);
          }

          h1 {
               text-align: center;
               color: #1976d2;
               margin-bottom: 26px;
          }

          .profile-info {
               margin-bottom: 24px;
          }

          .info-row {
               display: flex;
               padding: 12px 0;
               border-bottom: 1px solid #e0e0e0;
          }

          .info-row:last-child {
               border-bottom: none;
          }

          .info-label {
               font-weight: 600;
               color: #1976d2;
               min-width: 120px;
               flex-shrink: 0;
          }

          .info-value {
               color: #333;
               flex: 1;
          }

          .actions {
               display: flex;
               flex-direction: column;
               gap: 12px;
               margin-top: 24px;
          }

          .btn {
               display: block;
               text-align: center;
               padding: 12px 20px;
               border-radius: 6px;
               text-decoration: none;
               font-size: 16px;
               font-weight: bold;
               transition: background 0.2s;
          }

          .btn-primary {
               background: #1976d2;
               color: #fff;
          }

          .btn-primary:hover {
               background: #0f437a;
          }

          .btn-secondary {
               background: #f0f0f0;
               color: #333;
               border: 1px solid #ccc;
          }

          .btn-secondary:hover {
               background: #e0e0e0;
          }

          .btn-logout {
               background: #f44336;
               color: #fff;
          }

          .btn-logout:hover {
               background: #c62828;
          }
          .cancel-link {
               display: inline-block;
               margin-top: 18px;
               text-align: center;
               color: #1976d2;
               text-decoration: none;
               font-size: 16px;
               font-weight: bold;
          }

          .cancel-link:hover {
               text-decoration: underline;
          }
     </style>
</head>

<body>
     <div class="container">
          <a href="{{ url_for('patient_dashboard') }}" class="cancel-link">&larr; Back to Dashboard</a>
          <h1>My Profile</h1>
          <div class="profile-info">
               <div class="info-row">
                    <div class="info-label">Patient ID:</div>
                    <div class="info-value">{{ patient.pat_id }}</div>
               </div>
               <div class="info-row">
                    <div class="info-label">Name:</div>
                    <div class="info-value">{{ patient.name }}</div>
               </div>
               <div class="info-row">
                    <div class="info-label">Email:</div>
                    <div class="info-value">{{ patient.email }}</div>
               </div>
               <div class="info-row">
                    <div class="info-label">Age:</div>
                    <div class="info-value">{{ patient.age }}</div>
               </div>
               <div class="info-row">
                    <div class="info-label">Blood Type:</div>
                    <div class="info-value">{{ patient.blood }}</div>
               </div>
               <div class="info-row">
                    <div class="info-label">Gender:</div>
                    <div class="info-value">{{ patient.gender }}</div>
               </div>
               <div class="info-row">
                    <div class="info-label">Phone:</div>
                    <div class="info-value">{{ patient.contact_info }}</div>
               </div>
          </div>
          <div class="actions">
               <a href="{{ url_for('edit_patient_profile') }}" class="btn btn-primary">Edit Profile</a>
               
               <a href="{{ url_for('logout') }}" class="btn btn-logout">Logout</a>
          </div>
     </div>
</body>

</html>
