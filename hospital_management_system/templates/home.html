<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 480px;
            margin: 60px auto;
            background: #fff;
            padding: 36px 36px 30px 36px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.09);
        }
        h1 {
            text-align: center;
            color: #1976d2;
            margin-bottom: 30px;
        }
        .actions-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin-bottom: 36px;
        }
        .login-link {
            background: #1976d2;
            color: #fff;
            padding: 14px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
            min-width: 145px;
            text-align: center;
        }
        .login-link:hover {
            background: #0f437a;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #444;
            margin-bottom: 12px;
        }
        .register-section {
            text-align: center;
            margin-top: 18px;
        }
        .register-link {
            background: #43a047;
            color: #fff;
            padding: 14px 44px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
            display: inline-block;
            margin-top: 10px;
        }
        .register-link:hover {
            background: #237d33;
        }
        @media (max-width: 570px) {
            .container { padding: 18px 6px 16px 6px;}
            .actions-row { flex-direction: column; gap: 13px;}
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hospital Management System</h1>
        <div class="section-title">Login As</div>
        <div class="actions-row">
            <a class="login-link" href="/admin/login">Admin Login</a>
            <a class="login-link" href="/doctor/login">Doctor Login</a>
            <a class="login-link" href="/patient/login">Patient Login</a>
        </div>
        <div class="register-section">
            <div class="section-title">New Patient?</div>
            <a class="register-link" href="/patient/register">Register Here</a>
        </div>
    </div>
</body>
</html>
