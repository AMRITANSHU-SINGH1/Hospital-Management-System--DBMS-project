<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <title>Edit Profile</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
          body {
               font-family: Arial, sans-serif;
               background-color: #f5f5f5;
               margin: 0;
               padding: 0;
          }

          .container {
               max-width: 450px;
               margin: 54px auto;
               background: #fff;
               padding: 30px 28px 24px 28px;
               border-radius: 10px;
               box-shadow: 0 4px 16px rgba(0, 0, 0, 0.09);
          }

          h1 {
               text-align: center;
               color: #1976d2;
               margin-bottom: 22px;
          }

          .form-group {
               margin-bottom: 17px;
          }

          label {
               font-weight: 500;
               color: #1976d2;
               display: block;
               margin-bottom: 7px;
          }

          input[type="text"],
          input[type="number"],
          select {
               width: 100%;
               padding: 10px;
               border-radius: 5px;
               border: 1px solid #ccc;
               font-size: 16px;
               box-sizing: border-box;
               margin-bottom: 3px;
          }

          .btn-submit {
               background: #4CAF50;
               color: #fff;
               padding: 13px 0;
               border-radius: 6px;
               border: none;
               width: 100%;
               font-size: 17px;
               font-weight: bold;
               cursor: pointer;
               transition: background 0.2s;
               margin-top: 13px;
          }

          .btn-submit:hover {
               background: #357a38;
          }

          .flash-message {
               color: #d32f2f;
               background: #fdecea;
               border-radius: 6px;
               margin-bottom: 18px;
               padding: 8px 14px;
               font-weight: bold;
               text-align: center;
          }

          .cancel-link {
               display: inline-block;
               margin-top: 18px;
               text-align: center;
               color: #1976d2;
               text-decoration: none;
               font-size: 16px;
               font-weight: bold;
          }

          .cancel-link:hover {
               text-decoration: underline;
          }
     </style>
</head>

<body>
     <div class="container">
          <a href="{{ url_for('patient_dashboard') }}" class="cancel-link">&larr; Back to Dashboard</a>
          <h1>Edit Profile</h1>
          {% with messages = get_flashed_messages() %}
          {% if messages %}
          <div class="flash-message">
               {% for message in messages %}
               <p>{{ message }}</p>
               {% endfor %}
          </div>
          {% endif %}
          {% endwith %}
          <form method="POST" autocomplete="off">
               <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" value="{{ patient.name }}" required>
               </div>
               <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" value="{{ patient.age }}" required min="1" max="120">
               </div>
               <div class="form-group">
                    <label for="blood">Blood Type:</label>
                    <select id="blood" name="blood" required>
                         <option value="A+" {% if patient.blood=='A+' %}selected{% endif %}>A+</option>
                         <option value="A-" {% if patient.blood=='A-' %}selected{% endif %}>A-</option>
                         <option value="B+" {% if patient.blood=='B+' %}selected{% endif %}>B+</option>
                         <option value="B-" {% if patient.blood=='B-' %}selected{% endif %}>B-</option>
                         <option value="O+" {% if patient.blood=='O+' %}selected{% endif %}>O+</option>
                         <option value="O-" {% if patient.blood=='O-' %}selected{% endif %}>O-</option>
                         <option value="AB+" {% if patient.blood=='AB+' %}selected{% endif %}>AB+</option>
                         <option value="AB-" {% if patient.blood=='AB-' %}selected{% endif %}>AB-</option>
                    </select>
               </div>
               <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" required>
                         <option value="Male" {% if patient.gender=='Male' %}selected{% endif %}>Male</option>
                         <option value="Female" {% if patient.gender=='Female' %}selected{% endif %}>Female</option>
                         <option value="Other" {% if patient.gender=='Other' %}selected{% endif %}>Other</option>
                    </select>
               </div>
               <div class="form-group">
                    <label for="contact_info">Phone:</label>
                    <input type="text" id="contact_info" name="contact_info" value="{{ patient.contact_info }}"
                         required>
               </div>
               <button type="submit" class="btn-submit">Save Changes</button>
          </form>
          
     </div>
</body>

</html>
