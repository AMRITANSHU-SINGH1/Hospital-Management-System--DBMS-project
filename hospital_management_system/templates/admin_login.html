<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <title>Admin Login</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
          body {
               background: #f5f5f5;
               font-family: Arial, sans-serif;
               margin: 0;
               padding: 0;
          }

          .container {
               max-width: 390px;
               margin: 60px auto;
               background: #fff;
               padding: 36px 30px 26px 30px;
               border-radius: 9px;
               box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
          }

          h1 {
               color: #1976d2;
               text-align: center;
               margin-bottom: 28px;
          }

          label {
               font-weight: 500;
               color: #1976d2;
               display: block;
               margin-bottom: 7px;
          }

          input[type="text"],
          input[type="password"] {
               width: 100%;
               padding: 11px;
               border-radius: 5px;
               border: 1px solid #ccc;
               font-size: 16px;
               margin-bottom: 16px;
               box-sizing: border-box;
          }

          .btn-submit {
               background: #1976d2;
               color: #fff;
               padding: 12px 0;
               border-radius: 6px;
               border: none;
               width: 100%;
               font-size: 17px;
               font-weight: bold;
               cursor: pointer;
               transition: background 0.2s;
               margin-top: 10px;
          }

          .btn-submit:hover {
               background: #0f437a;
          }

          .flash-message {
               background: #fdecea;
               color: #d32f2f;
               border-radius: 6px;
               padding: 10px 15px;
               font-weight: bold;
               margin-bottom: 18px;
               text-align: center;
          }

          .back-link {
               display: inline-block;
               margin-bottom: 20px;
               color: #1976d2;
               text-decoration: none;
          }
     </style>
</head>

<body>
     <div class="container">
          <a href="{{ url_for('home') }}" class="back-link">&larr; Back</a>
          <h1>Admin Login</h1>
          {% with messages = get_flashed_messages() %}
          {% if messages %}
          <div class="flash-message">
               {% for message in messages %}
               <p>{{ message }}</p>
               {% endfor %}
          </div>
          {% endif %}
          {% endwith %}
          <form method="POST" autocomplete="off">
               <label for="username">Username:</label>
               <input type="text" id="username" name="username" required>

               <label for="password">Password:</label>
               <input type="password" id="password" name="password" required>

               <button class="btn-submit" type="submit">Login</button>
          </form>
     </div>
</body>

</html>
