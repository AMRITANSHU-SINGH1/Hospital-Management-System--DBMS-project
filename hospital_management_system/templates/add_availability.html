<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <title>Add Availability</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
          body {
               font-family: Arial, sans-serif;
               background-color: #f5f5f5;
               margin: 0;
               padding: 0;
          }

          .container {
               max-width: 420px;
               margin: 54px auto;
               background: #fff;
               padding: 30px 28px 24px 28px;
               border-radius: 10px;
               box-shadow: 0 4px 16px rgba(0, 0, 0, 0.09);
          }

          h1 {
               text-align: center;
               color: #1976d2;
               margin-bottom: 22px;
          }

          form {
               width: 100%;
          }

          .form-group {
               margin-bottom: 19px;
          }

          label {
               font-weight: 500;
               color: #1976d2;
               display: block;
               margin-bottom: 7px;
          }

          input[type="date"],
          input[type="time"],
          select {
               width: 100%;
               padding: 10px;
               border-radius: 5px;
               border: 1px solid #ccc;
               font-size: 16px;
               box-sizing: border-box;
               margin-bottom: 3px;
          }

          .btn-submit {
               background: #4CAF50;
               color: #fff;
               padding: 13px 0;
               border-radius: 6px;
               border: none;
               width: 100%;
               font-size: 17px;
               font-weight: bold;
               cursor: pointer;
               transition: background 0.2s;
               margin-top: 13px;
          }

          .btn-submit:hover {
               background: #357a38;
          }

          .flash-message {
               color: #d32f2f;
               background: #fdecea;
               border-radius: 6px;
               margin-bottom: 18px;
               padding: 8px 14px;
               font-weight: bold;
               text-align: center;
          }

          .dash-link {
               display: inline-block;
               margin-top: 18px;
               text-align: center;
               color: #1976d2;
               text-decoration: none;
               font-size: 16px;
               font-weight: bold;
          }

          .dash-link:hover {
               text-decoration: underline;
          }
     </style>
</head>

<body>
     <div class="container">
          <a href="{{ url_for('doctor_dashboard') }}" class="dash-link">&larr; Back to Dashboard</a>
          <h1>Add Availability</h1>
          {% with messages = get_flashed_messages() %}
          {% if messages %}
          <div class="flash-message">
               {% for message in messages %}
               <p>{{ message }}</p>
               {% endfor %}
          </div>
          {% endif %}
          {% endwith %}
          <form method="POST" autocomplete="off">
               <div class="form-group">
                    <label for="date">Date:</label>
                    <input type="date" id="date" name="date" required>
               </div>
               <div class="form-group">
                    <label for="start_time">Start Time:</label>
                    <input type="time" id="start_time" name="start_time" required>
               </div>
               <div class="form-group">
                    <label for="end_time">End Time:</label>
                    <input type="time" id="end_time" name="end_time" required>
               </div>
               <div class="form-group">
                    <label for="slot_duration">Slot Duration (minutes):</label>
                    <select id="slot_duration" name="slot_duration">
                         <option value="15">15 minutes</option>
                         <option value="30" selected>30 minutes</option>
                         <option value="45">45 minutes</option>
                         <option value="60">60 minutes</option>
                    </select>
               </div>
               <button type="submit" class="btn-submit">Add Availability</button>
          </form>
     </div>
</body>

</html>
