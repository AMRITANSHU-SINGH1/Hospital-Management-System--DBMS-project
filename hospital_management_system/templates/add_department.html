<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Add Department</title>
     <style>
          body {
               font-family: Arial, sans-serif;
               background-color: #f5f5f5;
               margin: 0;
               padding: 0;
          }
          .container {
               max-width: 600px;
               margin: 40px auto;
               background: #fff;
               padding: 30px 40px;
               border-radius: 10px;
               box-shadow: 0 4px 16px rgba(0,0,0,0.07);
          }
          h1 {
               color: #333;
               text-align: center;
               margin-bottom: 30px;
          }
          .form-group {
               margin-bottom: 20px;
          }
          label {
               display: block;
               margin-bottom: 8px;
               font-weight: 500;
               color: #1976d2;
          }
          input[type="text"], select {
               width: 100%;
               padding: 10px;
               border-radius: 5px;
               border: 1px solid #ccc;
               font-size: 16px;
               box-sizing: border-box;
               margin-bottom: 3px;
          }
          .btn-submit {
               background: #4CAF50;
               color: white;
               padding: 12px 32px;
               border: none;
               border-radius: 6px;
               font-size: 16px;
               cursor: pointer;
               margin-top: 10px;
               transition: background 0.2s;
               display: block;
               width: 100%;
          }
          .btn-submit:hover {
               background: #357a38;
          }
          .back-link {
               display: inline-block;
               margin-bottom: 20px;
               color: #1976d2;
               text-decoration: none;
               font-size: 15px;
          }
     </style>
</head>
<body>
     <div class="container">
          <a href="/ADMIN-HOME" class="back-link">&larr; Admin Dashboard</a>
          <h1>Add Department</h1>
          <form method="POST" autocomplete="off">
               <div class="form-group">
                    <label for="name">Department Name:</label>
                    <input type="text" name="name" id="name" required>
               </div>
               <div class="form-group">
                    <label for="head">Head of Department (Doctor ID):</label>
                    <select name="head" id="head">
                         {% for doc in doctors %}
                         <option value="{{doc.doc_id}}">{{doc.doc_id}}: {{doc.name}}</option>
                         {% endfor %}
                         <option value="None">None</option>
                    </select>
               </div>
               <button type="submit" class="btn-submit">Add Department</button>
          </form>
     </div>
</body>
</html>
