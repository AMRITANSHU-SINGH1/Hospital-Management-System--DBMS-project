<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Update Patient Details</title>
     <style>
          body {
               font-family: Arial, sans-serif;
               background-color: #f5f5f5;
               margin: 0;
               padding: 0;
          }
          .container {
               max-width: 650px;
               margin: 40px auto;
               background: #fff;
               padding: 30px 40px;
               border-radius: 10px;
               box-shadow: 0 4px 16px rgba(0,0,0,0.07);
          }
          h1 {
               color: #333;
               text-align: center;
               margin-bottom: 28px;
          }
          .form-group {
               margin-bottom: 17px;
          }
          label {
               display: block;
               margin-bottom: 7px;
               font-weight: 500;
               color: #1976d2;
          }
          input[type="text"], input[type="email"], input[type="number"] {
               width: 100%;
               padding: 10px;
               border-radius: 5px;
               border: 1px solid #ccc;
               font-size: 16px;
               box-sizing: border-box;
               margin-bottom: 3px;
          }
          .btn-submit {
               background: #1976d2;
               color: white;
               padding: 12px 29px;
               border: none;
               border-radius: 6px;
               font-size: 16px;
               cursor: pointer;
               margin-top: 15px;
               transition: background 0.2s;
               display: block;
               width: 100%;
          }
          .btn-submit:hover {
               background: #00397b;
          }
          .back-link {
               display: inline-block;
               margin-bottom: 20px;
               color: #1976d2;
               text-decoration: none;
               font-size: 15px;
          }
     </style>
</head>
<body>
     <div class="container">
          <a href="/ADMIN-HOME" class="back-link">&larr; Admin Dashboard</a>
          <h1>Update Patient Details</h1>
          <form action="/update_pat/{{task.id}}" method="POST" autocomplete="off">
               <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" name="name" id="name" value="{{task.name}}" required>
               </div>
               <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" value="{{task.email}}">
               </div>
               <div class="form-group">
                    <label for="contact_info">Phone No:</label>
                    <input type="number" name="contact_info" id="contact_info" value="{{task.contact_info}}" required>
               </div>
               <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" name="age" id="age" value="{{task.age}}" required>
               </div>
               <div class="form-group">
                    <label for="blood">Blood Group:</label>
                    <input type="text" name="blood" id="blood" value="{{task.blood}}" required>
               </div>
               <div class="form-group">
                    <label for="gender">Gender:</label>
                    <input type="text" name="gender" id="gender" value="{{task.gender}}" required>
               </div>
               <button type="submit" class="btn-submit">Update</button>
          </form>
     </div>
</body>
</html>
